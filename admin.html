<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GUPPY.IO - ADMIN PANEL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c0f;color:#f1f5f9;font-family:Arial,sans-serif}
.login-container{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#111418;padding:40px;border-radius:20px;border:1px solid #f97316;width:350px;text-align:center}
.login-box input{width:100%;padding:12px;margin:10px 0;background:#1a1f2e;border:1px solid #333;border-radius:8px;color:white}
.login-box button{width:100%;padding:12px;background:#f97316;border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer}
.admin-container{display:none;max-width:1200px;margin:0 auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #f97316}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;background:#111418;border:1px solid #333;border-radius:8px;cursor:pointer}
.tab.active{background:#f97316;color:white;border-color:#f97316}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:30px}
.stat-card{background:#111418;padding:20px;border-radius:12px;border:1px solid #333;text-align:center}
.stat-card .num{font-size:28px;font-weight:bold;margin-top:10px}
.stat-card.orange .num{color:#f97316}
.stat-card.green .num{color:#22c55e}
.stat-card.red .num{color:#ef4444}
.table-container{overflow-x:auto;background:#111418;border-radius:12px;border:1px solid #333}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #333}
th{background:#1a1f2e;color:#f97316}
tr:hover{background:#1a1f2e}
.badge{padding:4px 8px;border-radius:12px;font-size:12px}
.badge-active{background:#22c55e20;color:#22c55e;border:1px solid #22c55e}
.badge-banned{background:#ef444420;color:#ef4444;border:1px solid #ef4444}
.badge-pending{background:#fbbf2420;color:#fbbf24;border:1px solid #fbbf24}
.badge-done{background:#22c55e20;color:#22c55e;border:1px solid #22c55e}
.btn-sm{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin:2px}
.btn-green{background:#22c55e;color:white}
.btn-red{background:#ef4444;color:white}
.btn-blue{background:#3b82f6;color:white}
.search-input{width:100%;padding:12px;margin-bottom:15px;background:#1a1f2e;border:1px solid #333;border-radius:8px;color:white}
.toast{position:fixed;bottom:20px;right:20px;background:#111418;border:1px solid #f97316;padding:12px 24px;border-radius:8px;opacity:0;transition:0.3s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="login-container" id="loginContainer">
<div class="login-box">
<h2 style="color:#f97316;margin-bottom:20px">⛏ ADMIN PANEL</h2>
<input type="password" id="adminPassword" placeholder="Password Admin">
<button onclick="doLogin()">MASUK</button>
<p id="loginError" style="color:#ef4444;margin-top:10px;display:none">Password salah!</p>
</div>
</div>

<div class="admin-container" id="adminContainer">
<div class="topbar">
<h2 style="color:#f97316">⛏ GUPPY.IO - ADMIN PANEL</h2>
<button onclick="doLogout()" style="padding:8px 16px;background:#ef4444;border:none;border-radius:6px;color:white;cursor:pointer">KELUAR</button>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('dashboard')">📊 DASHBOARD</div>
<div class="tab" onclick="showTab('users')">👥 USERS</div>
<div class="tab" onclick="showTab('withdraw')">💸 WITHDRAW</div>
<div class="tab" onclick="showTab('banned')">🚫 BANNED</div>
</div>

<div id="dashboardView">
<div class="stats-grid" id="statsGrid"></div>
<div class="table-container">
<table>
<thead><tr><th>Nama</th><th>Username</th><th>Poin</th><th>Bergabung</th><th>Status</th></tr></thead>
<tbody id="recentUsers"></tbody>
</table>
</div>
</div>

<div id="usersView" style="display:none">
<input type="text" id="searchUser" class="search-input" placeholder="Cari nama atau username..." onkeyup="filterUsers()">
<div class="table-container">
<table>
<thead><tr><th>Nama</th><th>Username/ID</th><th>Poin</th><th>Total Mining</th><th>Referral</th><th>Bergabung</th><th>Status</th><th>Aksi</th></tr></thead>
<tbody id="usersTable"></tbody>
</table>
</div>
</div>

<div id="withdrawView" style="display:none">
<div class="table-container">
<table>
<thead><tr><th>Nama User</th><th>Jumlah Poin</th><th>Nominal (USDT)</th><th>Alamat Wallet</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead>
<tbody id="withdrawTable"></tbody>
</table>
</div>
</div>

<div id="bannedView" style="display:none">
<div class="table-container">
<table>
<thead><tr><th>Nama</th><th>Username/ID</th><th>Poin</th><th>Alasan Ban</th><th>Aksi</th></tr></thead>
<tbody id="bannedTable"></tbody>
</table>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Konfigurasi Firebase (SAMA DENGAN index.html)
const firebaseConfig = {
  apiKey: "AIzaSyBuUFAq63oLZkLmptMwlyIMPDMPDBLy8CE",
  authDomain: "minigupyy.firebaseapp.com",
  projectId: "minigupyy",
  storageBucket: "minigupyy.firebasestorage.app",
  messagingSenderId: "646664049064",
  appId: "1:646664049064:web:e85217dd85d6afad2a8d9d"
};

const ADMIN_PASSWORD = "guppy2026admin";
let db, allUsers = [];

// INIT
const app = initializeApp(firebaseConfig);
db = getFirestore(app);

// LOGIN
window.doLogin = function() {
    const pwd = document.getElementById('adminPassword').value;
    if(pwd === ADMIN_PASSWORD) {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('adminContainer').style.display = 'block';
        loadAllData();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
};

window.doLogout = function() {
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('adminContainer').style.display = 'none';
    document.getElementById('adminPassword').value = '';
};

// LOAD DATA
async function loadAllData() {
    showToast('🔄 Memuat data...');
    try {
        const usersRef = collection(db, 'users');
        const snapshot = await getDocs(usersRef);
        allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        renderDashboard();
        renderUsers();
        renderWithdraw();
        renderBanned();
        showToast('✅ Data berhasil dimuat! (' + allUsers.length + ' user)');
    } catch(e) {
        showToast('❌ Error: ' + e.message);
        console.error(e);
    }
}

// DASHBOARD
function renderDashboard() {
    const active = allUsers.filter(u => !u.banned);
    const banned = allUsers.filter(u => u.banned);
    const totalPoin = allUsers.reduce((s, u) => s + (u.poin || 0), 0);
    const totalMined = allUsers.reduce((s, u) => s + (u.totalMined || 0), 0);
    const pendingWd = allUsers.flatMap(u => (u.wd || []).filter(w => w.status === 'pending'));
    const totalWdDone = allUsers.flatMap(u => (u.wd || []).filter(w => w.status === 'done')).reduce((s, w) => s + (w.amt || 0), 0);
    
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><small>TOTAL USER</small><div class="num">${allUsers.length}</div></div>
        <div class="stat-card green"><small>USER AKTIF</small><div class="num">${active.length}</div></div>
        <div class="stat-card red"><small>USER BANNED</small><div class="num">${banned.length}</div></div>
        <div class="stat-card orange"><small>TOTAL POIN</small><div class="num">${totalPoin.toLocaleString('id-ID')}</div></div>
        <div class="stat-card orange"><small>TOTAL MINING</small><div class="num">${totalMined.toLocaleString('id-ID')}</div></div>
        <div class="stat-card"><small>WITHDRAW PENDING</small><div class="num">${pendingWd.length}</div></div>
        <div class="stat-card orange"><small>TOTAL WITHDRAW (USDT)</small><div class="num">${(totalWdDone/1000).toFixed(2)}</div></div>
    `;
    
    const recent = [...allUsers].sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 10);
    document.getElementById('recentUsers').innerHTML = recent.map(u => `
        <tr>
            <td><strong>${u.name || '-'}</strong></td>
            <td>${u.username ? '@' + u.username : u.id.slice(-8)}</td>
            <td class="orange">${(u.poin || 0).toLocaleString('id-ID')}</td>
            <td>${u.joinedAt || '-'}</td>
            <td><span class="badge ${u.banned ? 'badge-banned' : 'badge-active'}">${u.banned ? 'BANNED' : 'AKTIF'}</span></td>
        </tr>
    `).join('');
}

// USERS
function renderUsers(filter = '') {
    const list = filter ? allUsers.filter(u => (u.name || '').toLowerCase().includes(filter) || (u.username || '').toLowerCase().includes(filter)) : allUsers;
    document.getElementById('usersTable').innerHTML = list.map(u => `
        <tr>
            <td><strong>${u.name || '-'}</strong></td>
            <td>${u.username ? '@' + u.username : u.id.slice(-8)}</td>
            <td class="orange">${(u.poin || 0).toLocaleString('id-ID')}</td>
            <td>${(u.totalMined || 0).toLocaleString('id-ID')}</td>
            <td>${(u.refs || []).length} orang</td>
            <td>${u.joinedAt || '-'}</td>
            <td><span class="badge ${u.banned ? 'badge-banned' : 'badge-active'}">${u.banned ? 'BANNED' : 'AKTIF'}</span></td>
            <td>
                ${!u.banned ? `<button class="btn-sm btn-red" onclick="banUser('${u.id}')">🚫 BAN</button>` : `<button class="btn-sm btn-green" onclick="unbanUser('${u.id}')">✅ UNBAN</button>`}
                <button class="btn-sm btn-blue" onclick="resetPoin('${u.id}')">🔄 RESET POIN</button>
                <button class="btn-sm btn-blue" onclick="addPoin('${u.id}')">➕ TAMBAH POIN</button>
            </td>
        </tr>
    `).join('');
}

window.filterUsers = function() {
    renderUsers(document.getElementById('searchUser').value.toLowerCase());
};

// WITHDRAW
function renderWithdraw() {
    const allWd = allUsers.flatMap(u => (u.wd || []).map(w => ({ ...w, userName: u.name || '-', userId: u.id, userPoin: u.poin })));
    const pendingWd = allWd.filter(w => w.status === 'pending');
    const processedWd = allWd.filter(w => w.status !== 'pending');
    
    document.getElementById('withdrawTable').innerHTML = [...pendingWd, ...processedWd].map(w => `
        <tr>
            <td><strong>${w.userName}</strong><br><small>${w.userId.slice(-8)}</small></td>
            <td>${(w.amt || 0).toLocaleString('id-ID')} Poin</td>
            <td class="orange">${((w.amt || 0)/1000).toFixed(3)} USDT</td>
            <td><small>${w.address || '-'}</small></td>
            <td><small>${w.date || '-'}</small></td>
            <td><span class="badge ${w.status === 'done' ? 'badge-done' : w.status === 'rejected' ? 'badge-banned' : 'badge-pending'}">${w.status === 'done' ? '✅ SELESAI' : w.status === 'rejected' ? '❌ DITOLAK' : '⏳ PENDING'}</span></td>
            <td>
                ${w.status === 'pending' ? `
                    <button class="btn-sm btn-green" onclick="confirmWd('${w.userId}', ${w.amt}, '${w.date}')">✅ KONFIRMASI</button>
                    <button class="btn-sm btn-red" onclick="rejectWd('${w.userId}', ${w.amt}, '${w.date}')">❌ TOLAK</button>
                ` : '-'}
            </td>
        </tr>
    `).join('');
}

// BANNED
function renderBanned() {
    const banned = allUsers.filter(u => u.banned);
    document.getElementById('bannedTable').innerHTML = banned.map(u => `
        <tr>
            <td><strong>${u.name || '-'}</strong></td>
            <td>${u.username ? '@' + u.username : u.id.slice(-8)}</td>
            <td class="orange">${(u.poin || 0).toLocaleString('id-ID')}</td>
            <td>${u.banReason || 'Tidak ada alasan'}</td>
            <td><button class="btn-sm btn-green" onclick="unbanUser('${u.id}')">✅ UNBAN</button></td>
        </tr>
    `).join('');
}

// ACTIONS
window.banUser = async function(uid) {
    const reason = prompt('Alasan ban user ini:');
    if(!reason) return;
    try {
        const userRef = doc(db, 'users', uid);
        await updateDoc(userRef, { banned: true, banReason: reason });
        const user = allUsers.find(u => u.id === uid);
        if(user) { user.banned = true; user.banReason = reason; }
        renderUsers(document.getElementById('searchUser')?.value || '');
        renderBanned();
        renderDashboard();
        showToast('🚫 User berhasil dibanned!');
    } catch(e) { showToast('❌ Error: ' + e.message); }
};

window.unbanUser = async function(uid) {
    if(!confirm('Yakin unban user ini?')) return;
    try {
        const userRef = doc(db, 'users', uid);
        await updateDoc(userRef, { banned: false, banReason: '' });
        const user = allUsers.find(u => u.id === uid);
        if(user) { user.banned = false; user.banReason = ''; }
        renderUsers(document.getElementById('searchUser')?.value || '');
        renderBanned();
        renderDashboard();
        showToast('✅ User berhasil di-unban!');
    } catch(e) { showToast('❌ Error: ' + e.message); }
};

window.resetPoin = async function(uid) {
    if(!confirm('Reset poin user ini ke 0?')) return;
    try {
        const userRef = doc(db, 'users', uid);
        await updateDoc(userRef, { poin: 0 });
        const user = allUsers.find(u => u.id === uid);
        if(user) user.poin = 0;
        renderUsers(document.getElementById('searchUser')?.value || '');
        renderDashboard();
        showToast('🔄 Poin direset ke 0!');
    } catch(e) { showToast('❌ Error: ' + e.message); }
};

window.addPoin = async function(uid) {
    const amount = parseInt(prompt('Tambah poin berapa?'));
    if(isNaN(amount) || amount <= 0) return;
    try {
        const user = allUsers.find(u => u.id === uid);
        const newPoin = (user?.poin || 0) + amount;
        const userRef = doc(db, 'users', uid);
        await updateDoc(userRef, { poin: newPoin });
        if(user) user.poin = newPoin;
        renderUsers(document.getElementById('searchUser')?.value || '');
        renderDashboard();
        showToast(`✅ +${amount} poin ditambahkan!`);
    } catch(e) { showToast('❌ Error: ' + e.message); }
};

window.confirmWd = async function(uid, amt, date) {
    if(!confirm('Konfirmasi withdraw ini sudah dibayar?')) return;
    try {
        const userRef = doc(db, 'users', uid);
        const user = allUsers.find(u => u.id === uid);
        const wds = user?.wd || [];
        const wdIndex = wds.findIndex(w => w.amt === amt && w.date === date && w.status === 'pending');
        if(wdIndex !== -1) {
            wds[wdIndex].status = 'done';
            await updateDoc(userRef, { wd: wds });
            if(user) user.wd = wds;
            renderWithdraw();
            renderDashboard();
            showToast('✅ Withdraw dikonfirmasi!');
        }
    } catch(e) { showToast('❌ Error: ' + e.message); }
};

window.rejectWd = async function(uid, amt, date) {
    if(!confirm('Tolak withdraw ini? Poin akan dikembalikan ke user.')) return;
    try {
        const userRef = doc(db, 'users', uid);
        const user = allUsers.find(u => u.id === uid);
        const wds = user?.wd || [];
        const wdIndex = wds.findIndex(w => w.amt === amt && w.date === date && w.status === 'pending');
        if(wdIndex !== -1) {
            wds[wdIndex].status = 'rejected';
            const newPoin = (user?.poin || 0) + amt;
            await updateDoc(userRef, { wd: wds, poin: newPoin });
            if(user) { user.wd = wds; user.poin = newPoin; }
            renderWithdraw();
            renderDashboard();
            renderUsers();
            showToast('❌ Withdraw ditolak, poin dikembalikan!');
        }
    } catch(e) { showToast('❌ Error: ' + e.message); }
};

// TAB
window.showTab = function(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('dashboardView').style.display = tab === 'dashboard' ? 'block' : 'none';
    document.getElementById('usersView').style.display = tab === 'users' ? 'block' : 'none';
    document.getElementById('withdrawView').style.display = tab === 'withdraw' ? 'block' : 'none';
    document.getElementById('bannedView').style.display = tab === 'banned' ? 'block' : 'none';
    if(tab === 'users') renderUsers();
    if(tab === 'withdraw') renderWithdraw();
    if(tab === 'banned') renderBanned();
};

// TOAST
let toastTimer;
window.showToast = function(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
};

// Auto refresh tiap 30 detik
setInterval(() => { if(document.getElementById('adminContainer').style.display === 'block') loadAllData(); }, 30000);
</script>
</body>
</html>
