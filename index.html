<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GUPPY.IO - MINING APP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11054661' data-sdk='show_11054661'></script>
<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// KONFIGURASI FIREBASE (SESUAIKAN DENGAN PUNYA ANDA)
const firebaseConfig = {
  apiKey: "AIzaSyBuUFAq63oLZkLmptMwlyIMPDMPDBLy8CE",
  authDomain: "minigupyy.firebaseapp.com",
  projectId: "minigupyy",
  storageBucket: "minigupyy.firebasestorage.app",
  messagingSenderId: "646664049064",
  appId: "1:646664049064:web:e85217dd85d6afad2a8d9d"
};

// INISIALISASI
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.getDoc = getDoc;
window.doc = doc;
window.updateDoc = updateDoc;
window.setDoc = setDoc;
window.arrayUnion = arrayUnion;
window.collection = collection;
window.query = query;
window.where = where;
window.getDocs = getDocs;

console.log("Firebase terhubung!");
</script>
<style>
/* STYLE SAMA SEPERTI SEBELUMNYA */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0c0f;--card:#111418;--orange:#f97316;--green:#22c55e;--text:#f1f5f9;--muted:#64748b}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;max-width:480px;margin:0 auto}
.loading{position:fixed;inset:0;background:#0a0c0f;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#f97316;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.header{display:flex;justify-content:space-between;padding:15px;background:#111418;border-bottom:1px solid #f97316;position:sticky;top:0}
.logo{color:#f97316;font-weight:bold}
.poin{color:#f97316;font-size:20px;font-weight:bold}
.nav{display:flex;position:fixed;bottom:0;width:100%;max-width:480px;background:#111418;border-top:1px solid #333}
.nav-btn{flex:1;padding:12px;text-align:center;background:none;border:none;color:#64748b;cursor:pointer}
.nav-btn.active{color:#f97316}
.nav-btn span{font-size:20px;display:block}
.content{padding:15px;padding-bottom:70px}
.card{background:#111418;border-radius:12px;padding:20px;margin-bottom:15px;border:1px solid rgba(249,115,22,0.3)}
.btn{width:100%;padding:15px;background:#f97316;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:0.5}
.stat{display:flex;justify-content:space-between;padding:8px 0}
.orange{color:#f97316}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;padding:10px 20px;border-radius:20px;opacity:0;transition:0.3s;z-index:9999}
.toast.show{opacity:1}
input,select{width:100%;padding:12px;margin:10px 0;background:#222;border:1px solid #f97316;border-radius:8px;color:white}
</style>
</head>
<body>

<div id="loading" class="loading">
<div class="spinner"></div>
<p>MEMUAT DATA...</p>
</div>

<div id="app" style="display:none">
<div class="header">
<span class="logo">⛏ GUPPY.IO</span>
<span>POIN: <span id="poin">0</span></span>
</div>

<div class="content" id="content">
<div class="card">
<h3>⛏ MINING HARIAN</h3>
<button class="btn" id="mineBtn" onclick="doMine()">⛏ MINE (+10 POIN)</button>
<div class="stat"><span>Terakhir Mining:</span><span id="lastMine">-</span></div>
<div class="stat"><span>Total Mining:</span><span class="orange" id="totalMined">0</span></div>
</div>

<div class="card">
<h3>💰 SALDO</h3>
<h2 style="font-size:32px;margin:10px 0"><span id="balance">0</span> POIN</h2>
<p>≈ <span id="usdt">0</span> USDT</p>
</div>

<div class="card">
<h3>👥 REFERRAL</h3>
<p>Kode: <strong id="refCode">-</strong></p>
<button class="btn" style="background:#22c55e;margin-top:10px" onclick="copyRef()">📋 SALIN LINK</button>
<div class="stat"><span>Total Referral:</span><span id="refCount">0</span></div>
</div>
</div>

<div class="nav">
<button class="nav-btn active" onclick="showPage('home')"><span>⛏</span>MINE</button>
<button class="nav-btn" onclick="showPage('wallet')"><span>💰</span>WALLET</button>
<button class="nav-btn" onclick="showPage('referral')"><span>👥</span>REF</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// KONFIGURASI
const MINE_REWARD = 10;
const COOLDOWN_MS = 24 * 60 * 60 * 1000;
let userId, userData;
let dbReady = false;

// Ambil user dari Telegram
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();
const tgUser = tg?.initDataUnsafe?.user;

// ============ FIRESTORE FUNCTIONS ============
async function loadFromFirestore() {
    try {
        const docRef = doc(window.db, 'users', userId);
        const docSnap = await getDoc(docRef);
        
        if(docSnap.exists()) {
            userData = docSnap.data();
            console.log('Data dari Firestore:', userData);
            return true;
        }
        return false;
    } catch(e) {
        console.error('Firestore read error:', e);
        return false;
    }
}

async function saveToFirestore(updates) {
    if(!dbReady || !userId) return false;
    try {
        const docRef = doc(window.db, 'users', userId);
        await updateDoc(docRef, updates);
        console.log('Saved to Firestore:', updates);
        return true;
    } catch(e) {
        console.error('Firestore save error:', e);
        return false;
    }
}

async function createUserInFirestore() {
    try {
        const refCode = 'GP' + userId.slice(-4).toUpperCase() + Math.random().toString(36).slice(-2).toUpperCase();
        const userName = tgUser ? (tgUser.first_name || 'User') + (tgUser.last_name ? ' ' + tgUser.last_name : '') : 'User';
        
        const newUser = {
            uid: userId,
            name: userName,
            username: tgUser?.username || '',
            poin: 0,
            totalMined: 0,
            lastMine: null,
            streak: 0,
            adWatch: { date: '', count: 0 },
            refCode: refCode,
            refBy: null,
            refs: [],
            wd: [],
            joinedAt: new Date().toLocaleDateString('id-ID'),
            createdAt: Date.now(),
            banned: false
        };
        
        const docRef = doc(window.db, 'users', userId);
        await setDoc(docRef, newUser);
        return newUser;
    } catch(e) {
        console.error('Create user error:', e);
        throw e;
    }
}

// ============ MAIN INIT ============
async function init() {
    try {
        document.getElementById('loading').style.display = 'flex';
        
        // Get user ID
        if(tgUser?.id) {
            userId = String(tgUser.id);
        } else {
            userId = localStorage.getItem('guppy_uid') || 'demo_' + Date.now();
            localStorage.setItem('guppy_uid', userId);
        }
        
        // Cek koneksi Firebase
        if(window.db) {
            dbReady = true;
            const exists = await loadFromFirestore();
            
            if(!exists) {
                userData = await createUserInFirestore();
            }
            
            // Cek apakah user dibanned
            if(userData.banned) {
                document.getElementById('loading').innerHTML = `
                    <div style="text-align:center;padding:20px">
                        <div style="font-size:48px">🚫</div>
                        <h2>AKUN DIBANNED</h2>
                        <p>Alasan: ${userData.banReason || 'Melanggar ketentuan'}</p>
                    </div>
                `;
                return;
            }
        } else {
            // Fallback ke localStorage jika Firebase belum siap
            console.log('Firebase not ready, using localStorage');
            const saved = localStorage.getItem('guppy_' + userId);
            if(saved) {
                userData = JSON.parse(saved);
            } else {
                userData = {
                    uid: userId,
                    name: tgUser ? tgUser.first_name || 'User' : 'User',
                    poin: 0,
                    totalMined: 0,
                    lastMine: null,
                    refCode: 'GP' + userId.slice(-6).toUpperCase(),
                    refs: [],
                    wd: []
                };
            }
        }
        
        renderUI();
        startCountdown();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        // Cek referral
        const startParam = tg?.initDataUnsafe?.start_param;
        if(startParam && startParam !== userData.refCode && !userData.refBy) {
            await applyReferral(startParam);
        }
        
    } catch(e) {
        console.error('Init error:', e);
        document.getElementById('loading').innerHTML = `<p>Error: ${e.message}<br>Coba refresh</p>`;
    }
}

async function saveUser(updates) {
    userData = { ...userData, ...updates };
    
    // Save ke localStorage (cache)
    localStorage.setItem('guppy_' + userId, JSON.stringify(userData));
    
    // Save ke Firestore jika tersedia
    if(dbReady && !userData.banned) {
        await saveToFirestore(updates);
    }
}

async function applyReferral(refCode) {
    if(userData.refBy) return;
    
    await saveUser({ refBy: refCode });
    
    // Cari user dengan refCode ini
    if(dbReady) {
        try {
            const q = query(collection(window.db, 'users'), where('refCode', '==', refCode));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const ownerDoc = snap.docs[0];
                const ownerData = ownerDoc.data();
                const ownerRefs = ownerData.refs || [];
                
                if(!ownerRefs.includes(userId)) {
                    await updateDoc(ownerDoc.ref, {
                        refs: arrayUnion(userId),
                        poin: (ownerData.poin || 0) + 50
                    });
                    showToast('🎉 Kode referral digunakan!');
                }
            }
        } catch(e) { console.warn(e); }
    }
}

function renderUI() {
    if(!userData) return;
    
    document.getElementById('poin').innerText = userData.poin || 0;
    document.getElementById('balance').innerText = userData.poin || 0;
    document.getElementById('usdt').innerText = ((userData.poin || 0)/1000).toFixed(3);
    document.getElementById('totalMined').innerText = userData.totalMined || 0;
    document.getElementById('refCode').innerText = userData.refCode || '-';
    document.getElementById('refCount').innerText = (userData.refs || []).length;
    
    if(userData.lastMine) {
        document.getElementById('lastMine').innerText = new Date(userData.lastMine).toLocaleString();
    }
    
    // Update tombol mine
    const now = Date.now();
    const btn = document.getElementById('mineBtn');
    if(userData.lastMine && (now - userData.lastMine) < COOLDOWN_MS) {
        btn.disabled = true;
        const hours = Math.floor((COOLDOWN_MS - (now - userData.lastMine)) / 3600000);
        btn.innerText = `⏰ Tunggu ${hours} jam lagi`;
    } else {
        btn.disabled = false;
        btn.innerText = '⛏ MINE (+10 POIN)';
    }
}

// ============ MINING DENGAN IKLAN ============
window.doMine = async function() {
    if(!userData) { showToast('❌ Data belum siap'); return; }
    
    const now = Date.now();
    if(userData.lastMine && (now - userData.lastMine) < COOLDOWN_MS) {
        showToast('⏰ Sudah mining hari ini!');
        return;
    }
    
    showToast('🎬 Menampilkan iklan...');
    
    try {
        // TAMPILKAN IKLAN
        if(typeof show_11054661 !== 'undefined') {
            await show_11054661();
        } else {
            await new Promise(r => setTimeout(r, 1000));
        }
        
        // BERI REWARD
        const newPoin = (userData.poin || 0) + MINE_REWARD;
        const newTotal = (userData.totalMined || 0) + MINE_REWARD;
        
        await saveUser({
            poin: newPoin,
            totalMined: newTotal,
            lastMine: now,
            streak: (userData.streak || 0) + 1
        });
        
        renderUI();
        startCountdown();
        showToast('✅ +' + MINE_REWARD + ' POIN!');
        
        if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        
    } catch(e) {
        console.error('Error:', e);
        showToast('❌ Gagal, coba lagi');
    }
};

// ============ WITHDRAW ============
window.doWithdraw = async function() {
    const amt = parseInt(document.getElementById('wdAmount')?.value);
    const addr = document.getElementById('wdAddress')?.value;
    
    if(!amt || amt < 1000) { showToast('❌ Minimal 1000 poin'); return; }
    if(!addr) { showToast('❌ Isi alamat wallet'); return; }
    if(amt > (userData.poin || 0)) { showToast('❌ Saldo tidak cukup'); return; }
    
    const newWd = {
        amt: amt,
        address: addr,
        date: new Date().toLocaleString(),
        status: 'pending'
    };
    
    await saveUser({
        poin: (userData.poin || 0) - amt,
        wd: [newWd, ...(userData.wd || [])]
    });
    
    renderUI();
    showToast('✅ Withdraw ' + (amt/1000).toFixed(3) + ' USDT diajukan!');
    showPage('home');
};

// ============ REFERRAL ============
window.copyRef = function() {
    const link = 'https://t.me/guppy_Tetribot/guppycoin?start=' + userData.refCode;
    navigator.clipboard.writeText(link);
    showToast('✅ Link disalin!');
};

// ============ COUNTDOWN ============
let countInt;
function startCountdown() {
    if(countInt) clearInterval(countInt);
    countInt = setInterval(() => {
        if(!userData) return;
        const now = Date.now();
        const btn = document.getElementById('mineBtn');
        if(userData.lastMine && (now - userData.lastMine) < COOLDOWN_MS) {
            const rem = COOLDOWN_MS - (now - userData.lastMine);
            const hours = Math.floor(rem / 3600000);
            const mins = Math.floor((rem % 3600000) / 60000);
            if(btn) btn.innerText = `⏰ ${hours}j ${mins}m lagi`;
        } else if(btn) {
            btn.disabled = false;
            btn.innerText = '⛏ MINE (+10 POIN)';
        }
    }, 1000);
}

// ============ PAGE NAVIGATION ============
window.showPage = function(page) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    event.target.closest('.nav-btn').classList.add('active');
    
    const content = document.getElementById('content');
    
    if(page === 'wallet') {
        content.innerHTML = `
            <div class="card">
                <h3>💰 WALLET</h3>
                <h2 style="font-size:32px">${userData?.poin || 0} POIN</h2>
                <p>≈ ${((userData?.poin || 0)/1000).toFixed(3)} USDT</p>
                <hr style="margin:15px 0;border-color:#333">
                <h4>Withdraw (Min 1000 Poin)</h4>
                <input type="number" id="wdAmount" placeholder="Jumlah poin">
                <input type="text" id="wdAddress" placeholder="Alamat USDT (BEP20)">
                <button class="btn" onclick="doWithdraw()">💸 AJUKAN WITHDRAW</button>
            </div>
            <div class="card">
                <h4>RIWAYAT</h4>
                <div id="history">${userData?.wd?.length === 0 ? '<p style="color:#64748b">Belum ada riwayat</p>' : userData?.wd?.slice(0,5).map(w => `<p>${w.amt} poin - ${w.status}</p>`).join('')}</div>
            </div>
        `;
    } else if(page === 'referral') {
        content.innerHTML = `
            <div class="card">
                <h3>👥 REFERRAL</h3>
                <p>Dapatkan 50 POIN setiap teman bergabung!</p>
                <div style="background:#222;padding:15px;border-radius:10px;margin:15px 0;text-align:center">
                    <p style="font-size:12px;color:#64748b">KODE REFERRAL</p>
                    <p style="font-size:24px;color:#f97316">${userData?.refCode || '-'}</p>
                </div>
                <button class="btn" style="background:#22c55e;margin-bottom:10px" onclick="copyRef()">📋 SALIN LINK</button>
                <div class="stat"><span>Total Referral:</span><span>${userData?.refs?.length || 0}</span></div>
            </div>
        `;
    } else {
        location.reload();
    }
};

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// START
init();
</script>
</body>
</html>
